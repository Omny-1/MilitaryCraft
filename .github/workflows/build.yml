name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryCraft
          path: target/MilitaryCraft-*.jar
          if-no-files-found: error

  # Compiles the same sources against later Paper APIs to show how far forward the plugin
  # still resolves. It only proves that every API the code calls still exists in that
  # version; it is not a substitute for actually running the plugin on that server.
  #
  # This is informational and never fails the build. A red cell means that version removed
  # or renamed something the code uses, which is exactly what is worth knowing early. Add
  # newer Minecraft versions to the list as they are released.
  compatibility:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        paper:
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile against Paper ${{ matrix.paper }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dpaper.version=${{ matrix.paper }}-R0.1-SNAPSHOT
          -DskipTests compile

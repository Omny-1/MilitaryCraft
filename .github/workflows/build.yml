name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryCraft
          path: target/MilitaryCraft-*.jar
          if-no-files-found: error

  # Compiles the same sources against a span of Paper APIs to measure the supported range
  # instead of asserting it. A green cell means every API the code calls exists in that
  # version. That is a strong signal, but it is not the same as running the plugin there.
  #
  # The list deliberately reaches below the version the jar is built against:
  #
  #   1.21.2  expected to fail. Player.getCurrentInput does not exist yet and the attribute
  #           constants still carry their old names, so this cell is the evidence behind the
  #           documented floor rather than a problem to fix.
  #   1.21.3  the claimed minimum. If this one goes red, the documentation is wrong: some
  #           change started using an API that only appears in 1.21.4 or later.
  #
  # Informational, never fails the build. Add newer Minecraft versions as they are released;
  # a version that does not exist yet simply fails to resolve, which is harmless here.
  compatibility:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        paper:
          - '1.21.2'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile against Paper ${{ matrix.paper }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dpaper.version=${{ matrix.paper }}-R0.1-SNAPSHOT
          -DskipTests compile

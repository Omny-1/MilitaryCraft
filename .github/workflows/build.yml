name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MilitaryCraft
          path: target/MilitaryCraft-*.jar
          if-no-files-found: error

  # Compiles the same sources against every supported Paper API to measure the range instead
  # of asserting it. A green cell means every API the code calls exists in that version,
  # which is a strong signal but not the same as running the plugin there.
  #
  # The floor was measured rather than assumed. 1.21.3 is published and does compile as a
  # dependency, but building against it fails: something the code uses only appears in
  # 1.21.4. That is why the list starts there and why 1.21.4 is both the build target and
  # the documented minimum. Compiling against the floor is deliberate, since it makes it
  # impossible to reach for a newer API without a cell going red.
  #
  # Informational, never fails the build. Add newer Minecraft versions as they are released.
  compatibility:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        paper:
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'
          - '1.21.9'
          - '1.21.10'
          - '1.21.11'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Built with JDK 25 because Paper from 1.21.9 onward is compiled for Java 25, and a
      # JDK 21 compiler cannot read those class files at all. The plugin itself still
      # targets Java 21 through maven.compiler.release, so the jar keeps running on the
      # older servers in this range; only the compiler used to check it is newer.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Compile against Paper ${{ matrix.paper }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dpaper.version=${{ matrix.paper }}-R0.1-SNAPSHOT
          -DskipTests compile

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: MilitaryCraft
          path: target/MilitaryCraft-*.jar
          if-no-files-found: error

  # Compiles the same sources against every supported Paper API to measure the range instead
  # of asserting it. A green cell means every API the code calls exists in that version,
  # which is a strong signal but not the same as running the plugin there.
  #
  # Both ends were measured rather than assumed.
  #
  # Below: 1.21.3 is published and resolves, but building against it fails, so something the
  # code uses only appears in 1.21.4. The build target is that same version on purpose, which
  # makes it impossible to reach for a newer API without a cell going red.
  #
  # Above: 1.21.9, 1.21.10 and 1.21.11 do not compile. That was first assumed to be a
  # toolchain problem, since Paper needs Java 25 from 1.21.9 onward, but the cells still fail
  # on JDK 25 and they fail at the compile step rather than at setup, so those versions
  # genuinely changed something the code calls. They are left out until someone works through
  # the errors; adding them back needs JDK 25 here as well as the fix.
  #
  # Informational, never fails the build.
  compatibility:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        paper:
          - '1.21.4'
          - '1.21.5'
          - '1.21.6'
          - '1.21.7'
          - '1.21.8'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Matches the JDK the shipped jar is built with. Extending the matrix past 1.21.8 would
      # need JDK 25 here, because Paper is compiled for Java 25 from 1.21.9 onward.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile against Paper ${{ matrix.paper }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dpaper.version=${{ matrix.paper }}-R0.1-SNAPSHOT
          -DskipTests compile

# ---------------------------------------------------------------------------
#  airstrike - coordinate or item-called TNT bombing run.
# ---------------------------------------------------------------------------
airstrike:
  # ============================================================
  #  AirstrikePlugin settings
  #  A Su-57 fighter makes a bombing run over the target.
  # ============================================================
  
  # How many TNT bombs are dropped in one airstrike.
  tnt-count: 12
  
  # Horizontal bomb spread, in blocks.
  tnt-spread: 8
  
  # Bomb carpet length along the flight path, in blocks. The carpet is centered on the target:
  # the plane starts dropping length/2 blocks before the target and finishes length/2 blocks after it.
  # 0 means all bombs land exactly on the target.
  bomb-run-length: 50
  
  # TNT fuse ticks for dropped bombs. 20 ticks = 1 second.
  tnt-fuse-ticks: 80
  
  # Plane altitude above the target, in blocks.
  jet-altitude: 75
  
  # Flight speed in blocks/tick. 1 tick = 0.05 sec. Minimum 0.1.
  jet-speed: 1.8
  
  # How far from the target the plane starts its run.
  jet-start-distance: 220
  
  # How far beyond the target the plane flies before despawning.
  jet-exit-distance: 100
  
  # Cooldown between strikes for one player, in seconds.
  cooldown-seconds: 45
  
  # Maximum aiming distance in blocks, via ray trace.
  max-target-distance: 150
  
  # Maximum active airstrikes across the whole server.
  max-active-strikes: 5
  
  # Engine sound volume (0.0 - 10.0).
  engine-sound-volume: 8.0
  
  # Particle trail density: 1 = every tick, 2 = every second tick, etc. Minimum 1.
  trail-density: 1
  
  # Show a warning before impact in chat and title.
  warning-enabled: true
  
  # Radius in which players receive the warning, in blocks.
  warning-radius: 150
  
  # Warning text. Supports color codes with &.
  warning-message: "&c&lAIRSTRIKE! &eTarget engaged! Take cover!"
  
  # Messages. Supports color codes with &.
  messages:
    no-permission: "&cYou do not have permission to use airstrikes!"
    on-cooldown: "&eAirstrike recharging. Time left: &c{time}&e sec."
    strike-called: "&aAirstrike called! Target: &e{x}, {y}, {z}"
    item-given: "&aAirstrike beacon received. &eRight-click a surface to call a strike."
    no-target: "&cNo target in sight! Look at a surface."
    reloaded: "&aConfiguration reloaded."
    already-active: "&cAn airstrike is already active at this location!"
    too-many-active: "&cToo many active airstrikes. Wait a moment."
    players-only: "&cOnly players can use this command."

# ---------------------------------------------------------------------------
#  nuke - original NukeStrike heavy bomber and nuclear blast.
# ---------------------------------------------------------------------------
nuke:
  # ============================================================
  #  NukeStrike settings
  #  A bomber flies over the target and drops one nuclear bomb that slowly falls
  #  onto the selected point, then creates a massive crater explosion.
  # ============================================================
  
  # ----- Bomber carrier -----
  # Altitude at which the plane passes over the target, in blocks above the point.
  bomber-altitude: 90
  # Plane speed in blocks/tick. 1 tick = 0.05 sec. Heavy means slow. Minimum 0.1.
  bomber-speed: 1.0
  # How far from the target the plane starts its run.
  bomber-start-distance: 170
  # How far beyond the target the plane flies before despawning.
  bomber-exit-distance: 150
  # Plane engine volume (0.0 - 12.0).
  engine-sound-volume: 9.0
  
  # ----- Bomb fall -----
  # Maximum bomb fall speed, in blocks/tick. Higher means faster fall.
  bomb-fall-speed: 0.8
  # Ticks until the bomb accelerates to max speed. 20 ticks = 1 second.
  bomb-accel-ticks: 16
  # At what descent fraction the bomb becomes fully vertical, nose down.
  # 0.85 means the rotation is gradual and finishes closer to the ground. Lower = earlier.
  bomb-vertical-at: 0.85
  # Falling bomb whistle volume (0.0 - 12.0).
  fall-sound-volume: 6.0
  
  # ----- Explosion: damage and blast zone -----
  # Damage radius in blocks. 128 blocks = 8 chunks.
  damage-radius: 128
  # Maximum damage at the epicenter, in health points; 100 is guaranteed death. Ignores armor.
  max-damage: 100.0
  # Shockwave knockback at the epicenter.
  max-knockback: 3.5
  
  # ----- Explosion: crater -----
  # Crater radius in blocks. 64 = about a 128-block diameter.
  # The shape is intentionally rough: torn edges, uneven bottom, thrown-up rim.
  # Warning: larger values mean more terrain carving work.
  crater-radius: 64
  # Crater depth at the center, in blocks.
  crater-depth: 24
  # How many crater columns are processed per tick. Lower = smoother crater growth,
  # higher = faster but heavier for the server.
  crater-columns-per-tick: 700
  
  # ----- Player effects -----
  # Radius in which players receive blindness, in blocks. Only very close players are blinded.
  blindness-radius: 16
  # Blindness duration, in seconds.
  blindness-seconds: 10
  # Radiation duration for survivors, in seconds.
  radiation-seconds: 14
  # Radiation damage per second, in health points; 1.0 = half a heart. Ignores armor.
  radiation-damage: 1.0
  
  # ----- Falling warning -----
  # Show a warning while the bomb is falling.
  warning-enabled: true
  # Radius in which players receive a falling-bomb warning, in blocks.
  warning-radius: 200
  # Center-screen text for players caught in the blast zone at detonation.
  # A comma splits it into title and subtitle.
  in-blast-title: "Do not rush, you are already there"
  
  # ----- General -----
  # Cooldown between strikes for one player, in seconds.
  cooldown-seconds: 120
  # Maximum aiming distance in blocks, via ray trace.
  max-target-distance: 160
  # Maximum active nuclear strikes across the whole server.
  max-active-strikes: 2
  
  # Messages. Supports color codes with &.
  messages:
    no-permission: "&cYou do not have permission to use nuclear strikes!"
    on-cooldown: "&eNuclear strike recharging. Time left: &c{time}&e sec."
    strike-called: "&2☢ &aNuclear strike called! Target: &e{x}, {y}, {z}"
    item-given: "&aNuclear briefcase received. &eRight-click a surface to call a strike."
    no-target: "&cNo target in sight! Look at a surface."
    reloaded: "&aConfiguration reloaded."
    already-active: "&cA nuclear strike is already active at this location!"
    too-many-active: "&cToo many active nuclear strikes. Wait a moment."
    players-only: "&cOnly players can use this command."
    bad-coords: "&cInvalid coordinates. Usage: /nuke place <x> <y> <z> [world]"
    unknown-world: "&cWorld not found: &e{world}"
    place-called: "&2☢ &aNuclear strike assigned to coordinates: &e{x}, {y}, {z} &7({world})"

warkit:
  # ============================================================
  #  WarKit - military gear for battle royale gameplay
  #  Armor and attribute values apply to new items created after /warkit reload.
  #  Already issued items keep their existing stats.
  # ============================================================
  
  medkit:
    # Bandaging time in seconds; interrupted by any non-periodic damage.
    channel-seconds: 4.0
    # Cooldown after use, in seconds.
    cooldown-seconds: 20
  
  painkiller:
    # Fraction of incoming damage removed. 0.25 = -25%.
    damage-reduction: 0.25
    # Effect duration, in seconds.
    duration-seconds: 45
    # Cooldown, in seconds. Longer than duration means it cannot be kept up permanently.
    cooldown-seconds: 90
  
  vest:
    armor: 8.0
    toughness: 6.0
    knockback-resistance: 0.2
    # Walk speed penalty. 0.06 = -6%.
    speed-penalty: 0.06
    max-durability: 400
  
  kevlar:
    armor: 3.0
    toughness: 2.0
    max-durability: 300
  
  exosuit:
    armor: 4.0
    toughness: 2.0
    # Melee damage bonus in damage points. 4.0 = +2 hearts.
    attack-bonus: 4.0
    # Walk speed bonus. 0.15 = +15%.
    speed-bonus: 0.15
    # Jump strength bonus. 0.35 = +35%, enough to climb about 2 blocks.
    jump-bonus: 0.35
  
  gas-mask:
    armor: 1.0
  
  pads:
    armor: 2.0
    # Fraction of fall damage removed. 0.6 = -60%.
    fall-damage-reduction: 0.6
    # Additional safe fall distance, in blocks.
    safe-fall-bonus: 2.0
  
  camo:
    # Cooldown after camouflage is removed or broken, in seconds.
    cooldown-seconds: 15
  
  visor:
    # Player outline visibility between min and max blocks.
    min-distance: 10
    max-distance: 80
  
  marker:
    # Marker duration, in seconds.
    duration-seconds: 300
  
  ration:
    cooldown-seconds: 2
  
  repair:
    channel-seconds: 4.0
    cooldown-seconds: 60
    vehicle-health-fraction: 0.25
    vehicle-min-health: 10.0
  
  # ============================================================
  #  Combat weapons. Damage is in half-hearts (2 = one heart).
  # ============================================================
  weapons:
    # Headshot damage multiplier for firearms.
    headshot-multiplier: 1.5
    # Multiplies rifle/pistol damage when a WarKit hitscan bullet strikes vehicle hitboxes.
    vehicle-bullet-damage-multiplier: 0.35
  
    rifle:
      damage: 4.0
      range: 50.0
      magazine: 30
      reload-seconds: 2.5
      fire-cooldown-ticks: 3
      spread-degrees: 4.0
  
    pistol:
      damage: 3.0
      range: 30.0
      magazine: 12
      reload-seconds: 1.6
      fire-cooldown-ticks: 5
      spread-degrees: 3.2
  
    grenade-launcher:
      explosion-power: 2.5
      magazine: 4
      reload-seconds: 3.0
      fire-cooldown-ticks: 24      # longer cooldown between launches
      speed: 0.9                   # lower speed means a higher arc
      fuse-seconds: 1.5            # timed explosion, not impact-triggered
      bounce-damping: 0.45         # velocity retained after ricochet
  
    patriot:
      lock-range: 60.0
      lock-cone-degrees: 12.0
      explosion-power: 3.0
      # Direct hull damage on a locked vehicle hit; the blast adds falloff damage around it.
      vehicle-direct-damage: 35.0
      speed: 0.75
      turn-rate: 0.25
      magazine: 8                  # only 8 rockets, reload impossible
      cooldown-seconds: 10         # cooldown between launches
  
    frag-grenade:
      fuse-seconds: 1.5
      damage: 9.0
      radius: 4.0
      throw-speed: 1.3
  
    smoke-grenade:
      duration-seconds: 12.0
      radius: 6.0                  # denser and larger smoke screen
      throw-speed: 1.2
  
    flash-grenade:
      radius: 16.0
      blind-seconds: 7            # blinds everyone looking toward the flash
      throw-speed: 1.2
  
    impulse-grenade:
      radius: 4.5
      forward: 2.2
      up: 1.0
      no-fall-seconds: 8
      throw-speed: 1.2
      fuse-seconds: 0.7          # quick detonation; affects the owner too
  
    flamethrower:
      range: 5.0
      cone-degrees: 25.0
      tick-damage: 1.0
      fire-ticks: 60
      fuel: 220                   # more charges
      refuel-seconds: 0.0         # 0 = fuel does NOT regenerate
      leave-fire: true            # leave real fire on ground and trees
  
    chemical:
      range: 6.0
      cone-degrees: 22.0
      cloud-seconds: 8
      radius: 3.0
      fuel: 200                   # more charges
      cost-per-spray: 10
      refuel-seconds: 0.0         # 0 = reagent does NOT regenerate
  
    maxim:
      damage: 5.0
      range: 60.0
      fire-cooldown-ticks: 2
      spread-degrees: 3.5
      overheat-shots: 80
      overheat-cooldown-seconds: 6.0
      aim-arc-degrees: 70          # +/-70 degree fire sector from mount direction; cannot fire backward
      health: 20.0                 # mount durability; attacks damage it using attacker weapon damage
  
    barbed-wire:
      radius: 1.6                  # radius around each segment
      slow-amplifier: 4            # Slowness V: wire strongly holds enemies
      tick-damage: 3.0             # damage once per second, in half-hearts
      life-seconds: 120
      max-per-player: 6           # wall limit per player
      segments: 8                 # segments per wall
      spacing: 1.0                # spacing between segments
  
    # --- Engineer/saboteur kit ---
    trench-shovel:
      dig-seconds: 3.0            # digging time
      cooldown-seconds: 6
  
    molotov:
      radius: 3.0                 # fire spread radius
      fire-ticks: 100            # burn duration for ignited targets
      throw-speed: 1.3
  
    suicide-vest:
      radius: 6.0                 # living target damage radius
      max-damage: 40.0           # epicenter damage
      arm-range: 7.0             # a target must be inside this radius to detonate
      explosion-power: 8.0       # explosion power for environmental damage
      break-blocks: true         # whether the explosion breaks blocks
  
    firing-wall:
      width: 3                   # wall width
      height: 3                  # wall height, firing slit in the center
  
    tripwire:
      max-width: 4               # max wire width across the passage
      power: 1.0                 # trigger explosion power; damage is reduced by 3x
      life-seconds: 300
      max-per-player: 8
  
    c4:
      power: 4.0                 # charge explosion power
      break-blocks: true         # whether blocks are broken
      max-per-player: 8
      life-seconds: 300          # charge disappears if not detonated
  
    sleep-gas:
      duration-seconds: 14       # cloud lifetime
      radius: 4.5
      immobilize-after-seconds: 4 # time in gas before immobilization
      throw-speed: 1.2
  
    # --- Extra kit: mobility, recon, traps, automatic fire ---
    grappling-hook:
      range: 30.0                # hook range
      pull-strength: 1.35        # pull strength toward the target point
      up-boost: 0.45             # extra upward boost
      cooldown-seconds: 2.5
      no-fall-seconds: 6         # fall immunity after pull
      charges: 12                # successful hooks before breaking
  
    jump-jet:
      fuel: 30                   # fuel capacity
      cost-per-burst: 3          # fuel cost per burst
      refuel-seconds: 0.0        # 0 = fuel does NOT regenerate
      up: 0.85                   # vertical thrust
      forward: 0.35              # thrust along look direction
      no-fall-seconds: 4
  
    combat-stim:
      speed-amplifier: 1         # Speed II
      jump-amplifier: 1          # Jump Boost II
      regen-seconds: 5           # regeneration during buff
      buff-seconds: 10           # buff duration
      crash-seconds: 5           # crash after buff: weakness/slowness
      cooldown-seconds: 25
  
    recon-scanner:
      duration-seconds: 60       # active time; shows distance to the nearest player
  
    proximity-mine:
      power: 4.0                 # explosion power, breaks surroundings
      trigger-radius: 2.2        # trigger distance
      arm-seconds: 1.5           # arming delay to protect placer
      max-per-player: 6
      break-blocks: true         # break nearby blocks
      life-seconds: 300          # mine self-destructs if not triggered
  
    sentry-gun:
      damage: 2.5                # damage per shot
      range: 24.0
      fire-cooldown-ticks: 10    # fire interval; 10 ticks = 0.5 sec
      spread-degrees: 4.0
      health: 18.0               # turret durability; attacks can break it
      ammo: 40                   # ammo capacity
      life-seconds: 90           # lifetime before self-destruction
      max-per-player: 2

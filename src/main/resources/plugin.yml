name: MilitaryCraft
version: ${project.version}
main: me.bibo.militarycraft.MilitaryCraftPlugin
api-version: '1.21'
folia-supported: false
author: bibo
description: "Unified military plugin: vehicles, weapons, gear and support systems for Paper 1.21.4"

commands:
  mc:
    aliases: [militarycraft]
    description: MilitaryCraft root command.
    usage: /mc <menu|reload|modules|cleanup|module> ...
    permission: militarycraft.use
  shoot:
    description: Fire Artillery "Belochka" at real X/Z coordinates while operating it.
    usage: /shoot <x> <z>
    permission: svoart.use
    aliases: [arta]
  artillery:
    description: SvoArtillery compatibility command.
    usage: /artillery <give|create|remove|list|reload>
    permission: svoart.use
    aliases: [artillert]
  tank:
    description: TankCraft main command (give, spawn, place, remove, cleanup, list, reload).
    usage: /tank <give|spawn|place|remove|cleanup|list|reload>
    permission: tankcraft.use
  kamaz:
    description: KamazCraft main command (give, spawn, place, remove, cleanup, list, reload).
    usage: /kamaz <give|spawn|place|remove|cleanup|list|reload>
    permission: kamazcraft.use
    aliases: [pushinka, kamazcraft]
  jet:
    description: JetCraft main command (give, spawn, remove, list, reload, cleanup).
    usage: /jet <give|spawn|place|remove|list|reload|cleanup>
    permission: jetcraft.use
  nuke:
    description: Call a nuclear airstrike at your target location.
    usage: /nuke [item|reload|place]
    permission: nuke.use
    aliases: [nukestrike, yaderka, yadernyudar]
  tck:
    description: TCKBus main command.
    usage: /tck <give|place|setdrop|cleardrop|showdrop|remove|list|reload|cleanup>
    permission: tckbus.use
    aliases: [tckbus, bus]
  helicopter:
    description: HeliCraft main command (give, spawn, place, remove, list, reload, cleanup).
    usage: /helicopter <give|spawn|place|remove|list|reload|cleanup>
    permission: helicraft.use
    aliases: [heli, verto, vertolet]
  airship:
    description: AirshipCraft main command (give, spawn, place, remove, list, reload, cleanup).
    usage: /airship <give|spawn|place|remove|list|reload|cleanup>
    permission: airshipcraft.use
    aliases: [dirizhabl, zeppelin, dirigible]
  drone:
    description: DroneCraft / UAV main command.
    usage: /drone <give|spawn|place|fire|exit|remove|list|reload|cleanup>
    permission: dronecraft.use
    aliases: [bpla, uav]
  moto:
    description: Main MotoCraft command.
    usage: /moto <give|spawn|place|remove|cleanup|list|reload>
    aliases: [motorcycle, bike, motocraft]
  pickup:
    description: PickupCraft main command (give, spawn, place, remove, cleanup, list, reload, migrate).
    usage: /pickup <give|spawn|place|remove|cleanup|list|reload|migrate>
    permission: pickupcraft.use
  train:
    description: TrainCraft main command.
    usage: /train <give|place|remove|removeall|list|reload>
    aliases: [poezd]
  pvo:
    description: AntiAirCraft main command (give, place, remove, list, reload, cleanup).
    usage: /pvo <give|place|remove|list|reload|cleanup>
    permission: antiaircraft.use
    aliases: [antiair, aa, ciws, flak]
  airstrike:
    description: Call an airstrike at your target location.
    usage: /airstrike [item|reload]
    permission: airstrike.use
    aliases: [strike, aviaudar]

  vehiclecamera:
    description: VehicleCamera admin command.
    usage: /vehiclecamera reload
    aliases: [vcam]
    permission: vehiclecamera.admin

  warkit:
    description: WarKit equipment command.
    usage: /warkit <list|give|giveall|reload>
    permission: warkit.admin
    aliases: [wk]

permissions:
  militarycraft.use:
    description: Basic use of MilitaryCraft commands/items.
    default: true
  militarycraft.admin:
    description: Admin access to every MilitaryCraft module.
    default: op
  militarycraft.menu:
    description: Open the MilitaryCraft graphical command menu.
    default: true

  militarycraft.tank.use:
    description: Enter and drive tanks.
    default: true
  militarycraft.tank.place:
    description: Place tanks from the placer item.
    default: true
  militarycraft.tank.give:
    description: Use /mc tank give to create placer items.
    default: op
  militarycraft.tank.spawn:
    description: Use /mc tank spawn|place to create a tank directly.
    default: op
  militarycraft.tank.remove:
    description: Use /mc tank remove to delete a tank.
    default: op
  militarycraft.tank.list:
    description: List active tanks and their positions.
    default: op

  tankcraft.use:
    description: Allows the /tank command and basic tank usage.
    default: true
    children:
      tankcraft.drive: true
  tankcraft.drive:
    description: Enter and drive tanks.
    default: true
  tankcraft.place:
    description: Place tanks from the placer item.
    default: true
  tankcraft.give:
    description: Give tank placer items.
    default: true
